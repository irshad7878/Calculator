<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Header -->
        <div class="top-bar">
            <div>
                <h1>Calculator</h1>
                <p>Modern Calculator</p>
            </div>

            <button id="themeBtn" class="theme-btn">☀️</button>
        </div>

        <!-- Display -->
        <div class="display">
            <div id="previousDisplay" class="previous"></div>
            <div id="currentDisplay" class="current">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="delete">⌫</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-operation="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operation="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operation="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operation="+">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="equals" data-action="equals">=</button>

        </div>

        <!-- History -->
        <div class="history-section">

            <div class="history-title">
                <h2>History</h2>
                <button id="clearHistory">Clear</button>
            </div>

            <div id="historyList" class="history-list">
                <p class="empty">No calculations yet</p>
            </div>

        </div>

        <footer>
            Made with HTML, CSS & JavaScript
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
